<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>線上中國象棋 - 大廳</title>
    <style>
        body { font-family: 'Microsoft JhengHei', sans-serif; background: #2c3e50; color: white; display: flex; flex-direction: column; align-items: center; padding-top: 50px; }
        .lobby-container { background: #34495e; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); width: 500px; text-align: center; }
        .user-info { margin-bottom: 20px; font-size: 16px; color: #bdc3c7; }
        .user-info b { color: #f1c40f; }
        .room-list { margin: 20px 0; text-align: left; max-height: 300px; overflow-y: auto; }
        .room-item { 
            background: #2c3e50; padding: 15px; margin-bottom: 10px; 
            border-radius: 5px; display: flex; justify-content: space-between; align-items: center;
            border-left: 5px solid #e74c3c;
        }
        button { padding: 8px 16px; cursor: pointer; background: #e74c3c; color: white; border: none; border-radius: 3px; }
        button:hover { background: #c0392b; }
        .create-btn { font-size: 18px; padding: 12px 24px; width: 100%; margin-bottom: 20px; }

        /* === AI 挑戰區塊樣式 === */
        .ai-challenge-section {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .ai-challenge-section h3 {
            margin-top: 0;
            font-size: 18px;
            color: white;
        }
        .ai-options {
            display: flex;
            gap: 10px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }
        .ai-options select {
            padding: 8px 12px;
            border-radius: 5px;
            border: none;
            font-size: 14px;
            cursor: pointer;
        }
        .btn-ai {
            padding: 10px 20px;
            cursor: pointer;
            background: #f39c12;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn-ai:hover {
            background: #e67e22;
        }
    </style>
</head>
<body>
    <div class="lobby-container">
        <h1>遊戲大廳</h1>
        <div id="user-info" class="user-info">載入中...</div>
        <button class="create-btn" onclick="createRoom()">創建新房間</button>

        <!-- AI 挑戰區塊 -->
        <div class="ai-challenge-section">
            <h3>🤖 挑戰 AI 對戰</h3>
            <div class="ai-options">
                <select id="ai-color">
                    <option value="1">執紅（先手）</option>
                    <option value="-1">執黑（後手）</option>
                </select>
                <select id="ai-difficulty">
                    <option value="easy">🟢 簡單</option>
                    <option value="normal" selected>🟡 普通</option>
                    <option value="hard">🔴 困難</option>
                </select>
                <button class="btn-ai" onclick="challengeAI()">⚔️ 開始挑戰</button>
            </div>
        </div>

        <h3>目前可用房間</h3>
        <div id="room-list" class="room-list">
            <!-- 房間將在此動態生成 -->
            <div style="text-align: center; color: #bdc3c7;">目前沒有可加入的房間</div>
        </div>
        <button onclick="location.href='/ChineseChess/index'">登出</button>
    </div>

    <script>
        async function createRoom() {
            const username = localStorage.getItem('username');
            const resp = await fetch('/ChineseChess/api/rooms/create?username=' + username, { method: 'POST' });
            const room = await resp.json();
            window.location.href = `/ChineseChess/game?roomId=${room.roomId}`;
        }

        async function challengeAI() {
            const username = localStorage.getItem('username');
            const color = document.getElementById('ai-color').value;
            const difficulty = document.getElementById('ai-difficulty').value;

            const resp = await fetch(
                `/ChineseChess/api/admin/rooms/create-ai?username=${username}&color=${color}&difficulty=${difficulty}`,
                { method: 'POST' }
            );
            if (resp.ok) {
                const room = await resp.json();
                window.location.href = `/ChineseChess/game?roomId=${room.roomId}&isAI=true`;
            } else {
                alert('挑戰 AI 失敗，請重試！');
            }
        }

        async function joinRoom(roomId) {
            const username = localStorage.getItem('username');
            const resp = await fetch(`/ChineseChess/api/rooms/join?roomId=${roomId}&username=${username}`, { method: 'POST' });
            if (resp.ok) {
                window.location.href = `/ChineseChess/game?roomId=${roomId}`;
            } else {
                alert('加入失敗，房間可能已滿！');
            }
        }

        // 模擬獲取房間列表 (實際應透過 API)
        async function refreshRooms() {
            const resp = await fetch('/ChineseChess/api/rooms/list');
            const rooms = await resp.json();
            const listDiv = document.getElementById('room-list');
            listDiv.innerHTML = '';
            
            if (rooms.length === 0) {
                listDiv.innerHTML = '<div style="text-align: center; color: #bdc3c7;">目前沒有可加入的房間</div>';
                return;
            }

            rooms.forEach(room => {
                const item = document.createElement('div');
                item.className = 'room-item';
                const statusText = room.status === 'PLAYING' ? '對戰中' : (room.status === 'WAITING' ? '待戰中' : room.status);
                item.innerHTML = `
                    <span>房間 ID: <b>${room.roomId}</b> | 狀態: ${statusText}</span>
                    <button onclick="joinRoom('${room.roomId}')">加入</button>
                `;
                listDiv.appendChild(item);
            });
        }

        refreshRooms();
        setInterval(refreshRooms, 5000);

        // 顯示已登入使用者帳號
        const currentUsername = localStorage.getItem('username');
        if (currentUsername) {
            document.getElementById('user-info').innerHTML = `已登入帳號: <b>${currentUsername}</b>`;
        } else {
            document.getElementById('user-info').innerText = '未登入';
        }
    </script>
</body>
</html>
