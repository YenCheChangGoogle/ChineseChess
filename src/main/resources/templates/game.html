<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>線上中國象棋 - 遊戲室</title>
    <style>
        body { font-family: 'Microsoft JhengHei', sans-serif; background: #1a1a1a; color: white; display: flex; flex-direction: column; align-items: center; margin: 0; padding: 20px; }
        h1 { color: #f1c40f; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); margin-bottom: 10px; }
        
        #game-layout { display: flex; gap: 30px; align-items: flex-start; margin-top: 20px; }
        
        #game-container { 
            position: relative; 
            background: #d2b48c; 
            padding: 40px; 
            border-radius: 12px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.8); 
            border: 15px solid #5d4037;
            background-image: url('https://www.transparenttextures.com/patterns/wood-pattern.png');
        }
        
        #board-wrapper { position: relative; width: 640px; height: 720px; }
        
        #board-svg { 
            position: absolute; 
            top: 0; left: 0; 
            width: 640px; height: 720px; 
            pointer-events: none; 
            z-index: 1;
        }
        
        #board-grid { 
            position: absolute; 
            top: -40px; left: -40px; 
            display: grid; 
            grid-template-columns: repeat(9, 80px); 
            grid-template-rows: repeat(10, 80px); 
            z-index: 2;
        }

        
        .cell { 
            width: 80px; height: 80px; 
            cursor: pointer; 
            position: relative;
            z-index: 3;
        }
        .cell:hover { background: rgba(241, 196, 15, 0.2); }
        
        .piece-container {
            position: absolute;
            width: 640px;
            height: 720px;
            pointer-events: none;
            z-index: 10;
        }
        
        .piece { 
            position: absolute;
            width: 60px; height: 60px; 
            border-radius: 50%; 
            display: flex; justify-content: center; align-items: center; 
            border: 3px solid #333; 
            user-select: none;
            font-size: 28px; font-weight: bold;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            transition: all 0.2s ease;
            transform: translate(-30px, -30px);
        }
        .piece.selected { 
            outline: 4px solid #f1c40f; 
            transform: translate(-30px, -30px) scale(1.1); 
            z-index: 100;
            box-shadow: 0 0 20px #f1c40f;
        }
        .piece.red { background: radial-gradient(circle, #ff6b6b, #e74c3c); color: white; border-color: #c0392b; }
        .piece.black { background: radial-gradient(circle, #4b6584, #2f3542); color: white; border-color: #1e272e; }
        
        /* Board Flip for Perspective */
        #board-wrapper.flipped {
            transform: rotate(180deg);
        }
        #board-wrapper.flipped .piece {
            transform: translate(-30px, -30px) rotate(180deg);
        }
        #board-wrapper.flipped .piece.selected {
            transform: translate(-30px, -30px) rotate(180deg) scale(1.1);
        }
        
        /* Fix for river text to stay upright and centered during flip */
        #river-text-layer {
            position: absolute;
            top: 0; left: 0;
            width: 640px; height: 720px;
            pointer-events: none;
            z-index: 15;
        }
        
        #info-panel { 
            width: 300px; 
            background: #34495e; 
            padding: 20px; 
            border-radius: 10px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); 
            display: flex; 
            flex-direction: column; 
            gap: 15px;
        }
        
        .info-card       { background: #2c3e50; padding: 15px; border-radius: 8px; border-left: 5px solid #f1c40f; }
        .info-card-red   { background: #FF0000; padding: 15px; border-radius: 8px; border-left: 5px solid #f1c40f; }
        .info-card-black { background: #000000; padding: 15px; border-radius: 8px; border-left: 5px solid #f1c40f; }
        
        .info-label { font-size: 14px; color: white; margin-bottom: 5px; }
        .info-value { font-size: 20px; font-weight: bold; color: #fff; }
        
        #status-bar { 
            margin-bottom: 20px; font-size: 22px; padding: 12px 30px; 
            background: #f1c40f; color: #2c3e50; 
            border-radius: 50px; font-weight: bold; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        
        .controls { margin-top: 30px; display: flex; gap: 15px; }
        button { 
            padding: 12px 24px; font-size: 16px; cursor: pointer; 
            border: none; border-radius: 5px; transition: 0.2s; 
            font-weight: bold;
        }
        .btn-lobby { background: #95a5a6; color: white; }
        .btn-lobby:hover { background: #7f8c8d; }
        .btn-resign { background: #e74c3c; color: white; }
        .btn-resign:hover { background: #c0392b; }

        /* Check Alert */
        #check-alert {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #ff4757;
            color: white;
            padding: 15px 40px;
            border-radius: 10px;
            font-size: 28px;
            font-weight: bold;
            box-shadow: 0 0 20px rgba(255, 71, 87, 0.6);
            display: none;
            z-index: 500;
            animation: flash 1s infinite alternate;
            border: 3px solid white;
        }
        @keyframes flash {
            from { opacity: 1; transform: translateX(-50%) scale(1); }
            to { opacity: 0.7; transform: translateX(-50%) scale(1.1); }
        }

        /* Game Over Overlay */
        #game-over-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
            text-align: center;
        }
        .game-over-card {
            background: #2c3e50;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 0 30px #f1c40f;
            border: 4px solid #f1c40f;
            max-width: 500px;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .game-over-title {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        .victory { color: #f1c40f; }
        .defeat { color: #e74c3c; }
        .game-over-msg {
            font-size: 24px;
            margin-bottom: 30px;
            color: #bdc3c7;
        }
        .btn-return {
            padding: 15px 30px;
            font-size: 20px;
            background: #f1c40f;
            color: #2c3e50;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        .btn-return:hover { transform: scale(1.05); background: #f39c12; }

        /* 請對戰 動態提示 */
        #play-now-alert {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 20px;
            font-weight: bold;
            box-shadow: 0 0 25px rgba(46, 204, 113, 0.7);
            text-align: center;
            animation: playNowPulse 0.8s infinite alternate;
            border: 3px solid #fff;
            letter-spacing: 4px;
        }
        @keyframes playNowPulse {
            from { transform: scale(1); opacity: 0.85; box-shadow: 0 0 20px rgba(46, 204, 113, 0.5); }
            to   { transform: scale(1.03); opacity: 1;    box-shadow: 0 0 35px rgba(46, 204, 113, 0.9); }
        }
    </style>


</head>
<body>
    <h1>🏮 中國象棋線上對戰</h1>
    <div id="check-alert">⚠️ 將軍！請立刻防禦解除危機！</div>

    <div id="status-bar">等待連接伺服器...</div>
    
    <div id="game-layout">
        <div id="game-container">
            <div id="board-wrapper">
                <svg id="board-svg" viewBox="0 0 640 720">
                    <!-- Horizontal Lines -->
                    <line x1="0" y1="0" x2="640" y2="0" stroke="#5d4037" stroke-width="2" />
                    <line x1="0" y1="80" x2="640" y2="80" stroke="#5d4037" stroke-width="2" />
                    <line x1="0" y1="160" x2="640" y2="160" stroke="#5d4037" stroke-width="2" />
                    <line x1="0" y1="240" x2="640" y2="240" stroke="#5d4037" stroke-width="2" />
                    <line x1="0" y1="320" x2="640" y2="320" stroke="#5d4037" stroke-width="2" />
                    <line x1="0" y1="400" x2="640" y2="400" stroke="#5d4037" stroke-width="2" />
                    <line x1="0" y1="480" x2="640" y2="480" stroke="#5d4037" stroke-width="2" />
                    <line x1="0" y1="560" x2="640" y2="560" stroke="#5d4037" stroke-width="2" />
                    <line x1="0" y1="640" x2="640" y2="640" stroke="#5d4037" stroke-width="2" />
                    <line x1="0" y1="720" x2="640" y2="720" stroke="#5d4037" stroke-width="2" />
                    
                    <!-- Vertical Lines -->
                    <line x1="0" y1="0" x2="0" y2="720" stroke="#5d4037" stroke-width="2" />
                    <line x1="80" y1="0" x2="80" y2="720" stroke="#5d4037" stroke-width="2" />
                    <line x1="160" y1="0" x2="160" y2="720" stroke="#5d4037" stroke-width="2" />
                    <line x1="240" y1="0" x2="240" y2="720" stroke="#5d4037" stroke-width="2" />
                    <line x1="320" y1="0" x2="320" y2="720" stroke="#5d4037" stroke-width="2" />
                    <line x1="400" y1="0" x2="400" y2="720" stroke="#5d4037" stroke-width="2" />
                    <line x1="480" y1="0" x2="480" y2="720" stroke="#5d4037" stroke-width="2" />
                    <line x1="560" y1="0" x2="560" y2="720" stroke="#5d4037" stroke-width="2" />
                    <line x1="640" y1="0" x2="640" y2="720" stroke="#5d4037" stroke-width="2" />
                    
                    <!-- River -->
                    <rect x="0" y="320" width="640" height="80" fill="rgba(210, 180, 140, 0.3)" stroke="rgba(93, 64, 55, 0.5)" stroke-width="2" />
                    <text style="transform-origin: center;transform: rotate(180deg) translateX(317px);" x="160" y="378" font-family="Kaiti, STKaiti" font-size="68" fill="#5d4037" font-weight="bold" text-anchor="middle">漢 界</text>
                    <text x="480" y="378" font-family="Kaiti, STKaiti" font-size="68" fill="#5d4037" font-weight="bold" text-anchor="middle">楚 河</text>
                    
                    <!-- Palaces -->
                    <line x1="240" y1="0" x2="400" y2="160" stroke="#5d4037" stroke-width="2" />
                    <line x1="400" y1="0" x2="240" y2="160" stroke="#5d4037" stroke-width="2" />
                    <line x1="240" y1="560" x2="400" y2="720" stroke="#5d4037" stroke-width="2" />
                    <line x1="400" y1="560" x2="240" y2="720" stroke="#5d4037" stroke-width="2" />
                </svg>
                
                <div id="board-grid"></div>
                <div id="piece-layer" class="piece-container"></div>
            </div>
        </div>

        <div id="info-panel">
            <div class="info-card" id="role-card">
                <div class="info-label">玩家身分</div>
                <div id="my-role" class="info-value">偵測中...</div>
            </div>
            <div class="info-card">
                <div class="info-label">房間編號</div>
                <div id="room-id-display" class="info-value">-</div>
            </div>
            <div class="info-card">
                <div class="info-label">對手狀態</div>
                <div id="opponent-status" class="info-value">無對手</div>
            </div>
            
            <!-- 請對戰 動態提示 -->
            <div id="play-now-alert" style="display:none;">
                <span>⚔️ 請對戰 ⚔️</span>
            </div>
        </div>
    </div>

    <div class="controls">
        <button class="btn-resign" onclick="resign()">投降</button>
        <button class="btn-lobby" onclick="location.href='/ChineseChess/lobby'">返回大廳</button>
    </div>

    <div id="game-over-overlay">
        <div class="game-over-card">
            <div id="game-over-title" class="game-over-title"></div>
            <div id="game-over-msg" class="game-over-msg"></div>
            <button class="btn-return" onclick="location.href='/ChineseChess/lobby'">返回大廳</button>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('roomId');
        const username = localStorage.getItem('username');
        let socket;
        let selectedCell = null;
        let myColor = 0; // 1: Red, -1: Black
        let boardState = [];
        let playNowTimer = null;

        /**
         * 顯示「請對戰」動態提示，3 秒後自動消失。
         */
        function showPlayNowAlert() {
            const alert = document.getElementById('play-now-alert');
            alert.style.display = 'block';
            if (playNowTimer) clearTimeout(playNowTimer);
            playNowTimer = setTimeout(() => {
                alert.style.display = 'none';
            }, 3000);
        }

        const pieceMap = {
            '1': '俥', '2': '傌', '3': '相', '4': '仕', '5': '帥', '6': '炮', '7': '兵',
            '-1': '車', '-2': '馬', '-3': '象', '-4': '士', '-5': '將', '-6': '包', '-7': '卒'
        };

        function initBoard() {
            const gridDiv = document.getElementById('board-grid');
            gridDiv.innerHTML = '';
            // A real Chinese Chess board has 10 rows and 9 cols of intersections.
            // To detect clicks on these intersections using a grid of cells,
            // we create a grid of 10x9 cells.
            gridDiv.style.gridTemplateColumns = 'repeat(9, 80px)';
            gridDiv.style.gridTemplateRows = 'repeat(10, 80px)';
            
            for (let r = 0; r < 10; r++) {
                for (let c = 0; c < 9; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.row = r;
                    cell.dataset.col = c;
                    cell.onclick = () => handleCellClick(r, c);
                    gridDiv.appendChild(cell);
                }
            }
        }

        function renderBoard(board) {
            boardState = board;
            const pieceLayer = document.getElementById('piece-layer');
            pieceLayer.innerHTML = '';
            
            for (let r = 0; r < 10; r++) {
                for (let c = 0; c < 9; c++) {
                    const pieceVal = board[r][c];
                    if (pieceVal !== 0) {
                        const pieceDiv = document.createElement('div');
                        pieceDiv.className = `piece ${pieceVal > 0 ? 'red' : 'black'}`;
                        if (selectedCell && selectedCell.r === r && selectedCell.c === c) {
                            pieceDiv.classList.add('selected');
                        }
                        pieceDiv.innerText = pieceMap[pieceVal] || '';
                        pieceDiv.style.top = (r * 80) + 'px';
                        pieceDiv.style.left = (c * 80) + 'px';
                        pieceLayer.appendChild(pieceDiv);
                    }
                }
            }
        }

        function handleCellClick(r, c) {
            const piece = boardState[r][c];
            const isMyPiece = piece !== 0 && ((myColor === 1 && piece > 0) || (myColor === -1 && piece < 0));

            if (selectedCell) {
                if (isMyPiece) {
                    // Switch selected piece if clicking another of my own pieces
                    selectedCell = { r, c };
                    renderBoard(boardState);
                    return;
                }

                // Valid move attempt: empty cell or opponent's piece
                const sr = selectedCell.r;
                const sc = selectedCell.c;
                
                socket.send(JSON.stringify({
                    type: 'MOVE',
                    startRow: sr,
                    startCol: sc,
                    endRow: r,
                    endCol: c
                }));
                
                selectedCell = null;
                renderBoard(boardState);
            } else {
                if (isMyPiece) {
                    selectedCell = { r, c };
                    renderBoard(boardState);
                }
            }
        }

        function resign() {
            if (confirm('您確定要投降嗎？')) {
                socket.send(JSON.stringify({ type: 'RESIGN' }));
            }
        }

        function showGameOver(winnerColor, reason, loserName) {
            const overlay = document.getElementById('game-over-overlay');
            const title = document.getElementById('game-over-title');
            const msg = document.getElementById('game-over-msg');
            
            overlay.style.display = 'flex';
            
            if (myColor === winnerColor) {
                title.innerText = '🏆 您勝利了！';
                title.className = 'game-over-title victory';
                msg.innerText = reason === 'resignation' 
                    ? `對手 ${loserName} 已投降` 
                    : '您成功將對手將死！';
            } else if (myColor === 0) {
                title.innerText = '🏁 遊戲結束';
                title.className = 'game-over-title';
                msg.innerText = `勝利方: ${winnerColor === 1 ? '紅方' : '黑方'}`;
            } else {
                title.innerText = '💀 您敗北了';
                title.className = 'game-over-title defeat';
                msg.innerText = reason === 'resignation' 
                    ? '您已投降' 
                    : '對手將死了您的將帥！';
            }
        }

        function updateTurnStatus(turn) {
            const statusText = turn === 1 ? '🔴 目前輪到 紅方 操作' : '⚫ 目前輪到 黑方 操作';
            document.getElementById('status-bar').innerText = statusText;
            document.getElementById('check-alert').style.display = 'none';
        }

        function connect() {

            socket = new WebSocket(`ws://${window.location.host}/ChineseChess/game-ws`);

            socket.onopen = () => {
                document.getElementById('status-bar').innerText = '連線成功，正在加入房間...';
                socket.send(JSON.stringify({
                    type: 'JOIN',
                    roomId: roomId,
                    username: username
                }));
            };

            socket.onmessage = (event) => {
                const data = JSON.parse(event.data);
                console.log('WebSocket Message Received:', data); // Debug log
                
                if (data.type === 'JOIN_SUCCESS') {
                    myColor = data.color;
                    const colorText = myColor === 1 ? '紅方' : (myColor === -1 ? '黑方' : '觀戰');
                    
                    document.getElementById('role-card').className = 'info-card ' + (myColor === 1 ? 'info-card-red' : (myColor === -1 ? 'info-card-black' : 'info-card'));
                    
                    
                    document.getElementById('status-bar').innerText = `對局準備就緒`;
                    document.getElementById('my-role').innerText = colorText + ' - ' + username;
                    document.getElementById('room-id-display').innerText = roomId;
                    
                    // 顯示對手狀態：若伺服器回傳 opponent 則顯示帳號，否則判斷遊戲狀態
                    if (data.opponent) {
                        document.getElementById('opponent-status').innerText = '對戰⚔️ ' + data.opponent;
                    } else if (myColor !== 1 || data.gameState === 'PLAYING') {
                        document.getElementById('opponent-status').innerText = '對戰中';
                    } else {
                        document.getElementById('opponent-status').innerText = '無對手';
                    }
                    
                    // Flip board if I am the Black player (start at top)
                    if (myColor === -1) {
                        document.getElementById('board-wrapper').classList.add('flipped');
                    }
                    
                    if (data.currentTurn) {
                        updateTurnStatus(data.currentTurn);
                    }
                    
                    if (data.board) {
                        renderBoard(data.board);
                    } else {
                        socket.send(JSON.stringify({ type: 'SYNC' }));
                    }
                } else if (data.type === 'GAME_LOST_REDIRECT') {
                    /* 【修正】此訊息表示上一局因對方離線而結束
                     * 直接跳回大廳，不顯示「敗北」畫面 */
                    console.log('收到 GAME_LOST_REDIRECT，直接返回大廳...');
                    window.location.href = '/ChineseChess/lobby';
                } else if (data.type === 'RESIGN_REJECT') {
                    /* 【修正】沒有對手時按下投降，不顯示「敗北」，而是提示並跳回大廳 */
                    alert(data.message || '目前沒有對手，無法投降');
                    window.location.href = '/ChineseChess/lobby';
                } else if (data.type === 'BOARD_SYNC') {
                    renderBoard(data.board);
                } else if (data.type === 'PLAYER_JOINED') {
                    // 有人加入房間，顯示對方帳號
                    if (data.user !== username) {
                        document.getElementById('opponent-status').innerText = '⚔️ ' + data.user;
                    }
                    // Turn status is already set by JOIN_SUCCESS or TURN_CHANGED
                } else if (data.type === 'GAME_STARTED') {
                    // 從 players 列表中找出對手名稱
                    if (data.players && data.players.length >= 2) {
                        const opponent = data.players.find(p => p !== username);
                        if (opponent) {
                            document.getElementById('opponent-status').innerText = '對戰⚔️ ' + opponent;
                        } else {
                            document.getElementById('opponent-status').innerText = '對戰中';
                        }
                    } else {
                        document.getElementById('opponent-status').innerText = '對戰中';
                    }
                } else if (data.type === 'MOVE_MADE') {
                    if (data.board) {
                        renderBoard(data.board);
                    } else {
                        socket.send(JSON.stringify({ type: 'SYNC' }));
                    }
                } else if (data.type === 'TURN_CHANGED') {
                    updateTurnStatus(data.nextTurn);
                    if (data.nextTurn === myColor) {
                        showPlayNowAlert();
                    }
                } else if (data.type === 'CHECK') {
                    document.getElementById('check-alert').style.display = 'block';
                } else if (data.type === 'GAME_START_RESET') {
                    /* 【新邏輯】對手就位，棋盤歸位，顯示提示 1 秒後消失 */
                    const statusBar = document.getElementById('status-bar');
                    statusBar.innerText = '⚔️ 對手就位 對戰開始 ⚔️';
                    statusBar.style.background = '#2ecc71';
                    setTimeout(() => {
                        statusBar.style.background = '#f1c40f';
                        statusBar.innerText = '對局準備就緒';
                    }, 1000);
                    // 從 players 列表中找出對手名稱
                    if (data.players && data.players.length >= 2) {
                        const opponent = data.players.find(p => p !== username);
                        if (opponent) {
                            document.getElementById('opponent-status').innerText = '⚔️ ' + opponent;
                        }
                    }
                    // 重新同步棋盤
                    socket.send(JSON.stringify({ type: 'SYNC' }));
                } else if (data.type === 'ROOM_CLOSED_BY_ADMIN') {
                    /* 【修正】管理員強制關閉房間 */
                    alert(data.message || '管理者強制關閉房間!被迫離開!');
                    window.location.href = '/ChineseChess/lobby';
                } else if (data.type === 'ROOM_DELETED_BY_ADMIN') {
                    /* 【新邏輯】管理員強制刪除房間 */
                    alert(data.message || '管理者強制刪除房間!被迫離開!');
                    window.location.href = '/ChineseChess/lobby';
                } else if (data.type === 'GAME_OVER') {
                    showGameOver(data.winner, data.reason, data.loser);
                } else if (data.type === 'REDIRECT_TO_LOBBY') {
                    // 伺服器通知：對方離線，對局結束，3 秒後自動返回大廳
                    console.log('收到 REDIRECT_TO_LOBBY，3 秒後返回大廳...');
                    setTimeout(() => {
                        window.location.href = '/ChineseChess/lobby';
                    }, 3000);
                } else if (data.type === 'MOVE_INVALID') {
                    alert(data.message);
                }
            };

            socket.onclose = () => {
                document.getElementById('status-bar').innerText = '連線已中斷，請重新整理頁面。';
            };
        }

        initBoard();
        connect();
    </script>
</body>
</html>
