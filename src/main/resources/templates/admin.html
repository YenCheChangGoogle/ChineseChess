<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel - ChineseChess</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Microsoft JhengHei', sans-serif; }
        .admin-header { background: #343a40; color: white; padding: 20px 0; margin-bottom: 30px; }
        .card-title { border-bottom: 2px solid #dee2e6; padding-bottom: 10px; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="admin-header text-center">
        <h1 class="display-5">🛠️ 管理員控制面板</h1>
        <p class="lead">系統監控、使用者與房間管理</p>
    </div>

    <div class="container">
        <div class="row">
            <!-- Online Users Status -->
            <div class="col-md-12 mb-4">
                <div class="card shadow-sm p-4">
                    <h4 class="card-title">🌐 線上使用者狀態</h4>
                    <div id="onlineUserList" class="mt-3">
                        <p class="text-muted">載入中...</p>
                    </div>
                </div>
            </div>

            <!-- User Management -->
            <div class="col-md-6 mb-4">
                <div class="card shadow-sm p-4">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h4 class="card-title m-0">👤 使用者管理</h4>
                        <button class="btn btn-primary btn-sm" onclick="openUserModal('create')">＋ 建立帳號</button>
                    </div>
                    <div id="userList" class="mt-3">
                        <p class="text-muted">載入中...</p>
                    </div>
                </div>
            </div>

            <!-- Room Management -->
            <div class="col-md-6 mb-4">
                <div class="card shadow-sm p-4">
                    <h4 class="card-title">🏠 房間管理</h4>
                    <div id="roomList" class="mt-3">
                        <p class="text-muted">載入中...</p>
                    </div>
                </div>
            </div>
        </div>
        <div class="text-center mb-5">
            <a href="/ChineseChess/lobby" class="btn btn-secondary px-4">回到遊戲大廳</a>
        </div>
    </div>

    <!-- User Modal (Create/Edit) -->
    <div class="modal fade" id="userModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">使用者資訊</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="userForm">
                        <input type="hidden" id="userId">
                        <div class="mb-3">
                            <label class="form-label">用戶名</label>
                            <input type="text" id="username" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">密碼</label>
                            <input type="text" id="password" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">角色</label>
                            <select id="role" class="form-select">
                                <option value="USER">USER (一般使用者)</option>
                                <option value="ADMIN">ADMIN (管理員)</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">儲存變更</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const userModal = new bootstrap.Modal(document.getElementById('userModal'));

        async function fetchOnlineUsers() {
            try {
                const resp = await fetch('/ChineseChess/api/admin/online-users');
                const users = await resp.json();
                const div = document.getElementById('onlineUserList');
                if (users.length === 0) {
                    div.innerHTML = '<p class="text-muted">目前沒有在線使用者</p>';
                    return;
                }
                let html = '<div class="d-flex flex-wrap gap-2">';
                users.forEach(u => {
                    html += `<span class="badge bg-success p-2">${u.username}</span>`;
                });
                html += '</div>';
                div.innerHTML = html;
            } catch (e) {
                console.error('fetchOnlineUsers error:', e);
                document.getElementById('onlineUserList').innerHTML = '<p class="text-danger">載入失敗</p>';
            }
        }

        async function fetchUsers() {
            try {
                const resp = await fetch('/ChineseChess/api/admin/users');
                const users = await resp.json();
                const div = document.getElementById('userList');
                if (users.length === 0) {
                    div.innerHTML = '<p class="text-muted">目前沒有使用者</p>';
                    return;
                }
                let html = '<table class="table table-hover"><thead><tr><th>用戶名</th><th>角色</th><th>操作</th></tr></thead><tbody>';
                users.forEach(u => {
                    html += `<tr>
                        <td>${u.username}</td>
                        <td><span class="badge bg-secondary">${u.role || 'USER'}</span></td>
                        <td>
                            <button class="btn btn-sm btn-outline-primary me-1" onclick="openUserModal('edit', ${JSON.stringify(u).replace(/"/g, '&quot;')})">編輯</button>
                            <button class="btn btn-sm btn-outline-danger" onclick="deleteUser(${u.id})">刪除</button>
                        </td>
                    </tr>`;
                });
                html += '</tbody></table>';
                div.innerHTML = html;
            } catch (e) {
                console.error('fetchUsers error:', e);
                document.getElementById('userList').innerHTML = '<p class="text-danger">載入失敗</p>';
            }
        }

        async function fetchRooms() {
            try {
                const resp = await fetch('/ChineseChess/api/rooms/list');
                const rooms = await resp.json();
                const div = document.getElementById('roomList');
                if (rooms.length === 0) {
                    div.innerHTML = '<p class="text-muted">目前沒有活躍房間</p>';
                    return;
                }
                let html = '<table class="table table-hover"><thead><tr><th>房間 ID</th><th>狀態</th><th>操作</th></tr></thead><tbody>';
                rooms.forEach(r => {
                    html += `<tr>
                        <td><code>${r.roomId}</code></td>
                        <td><span class="badge ${r.status === 'PLAYING' ? 'bg-primary' : 'bg-warning'}">${r.status}</span></td>
                        <td>
                            <button class="btn btn-sm btn-outline-warning me-1" onclick="closeRoom('${r.roomId}')">關閉</button>
                            <button class="btn btn-sm btn-outline-danger" onclick="deleteRoom('${r.roomId}')">刪除</button>
                        </td>
                    </tr>`;
                });
                html += '</tbody></table>';
                div.innerHTML = html;
            } catch (e) {
                console.error('fetchRooms error:', e);
                document.getElementById('roomList').innerHTML = '<p class="text-danger">載入失敗</p>';
            }
        }

        function openUserModal(mode, user = null) {
            document.getElementById('userForm').reset();
            if (mode === 'edit' && user) {
                document.getElementById('modalTitle').innerText = '編輯使用者';
                document.getElementById('userId').value = user.id;
                document.getElementById('username').value = user.username;
                document.getElementById('password').value = user.password;
                document.getElementById('role').value = user.role || 'USER';
            } else {
                document.getElementById('modalTitle').innerText = '建立新帳號';
                document.getElementById('userId').value = '';
            }
            userModal.show();
        }

        document.getElementById('userForm').onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('userId').value;
            const user = {
                username: document.getElementById('username').value,
                password: document.getElementById('password').value,
                role: document.getElementById('role').value
            };

            const url = id ? '/ChineseChess/api/admin/users/update' : '/ChineseChess/api/admin/users/create';
            const resp = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(id ? { ...user, id: parseInt(id) } : user)
            });

            if (resp.ok) {
                userModal.hide();
                fetchUsers();
            } else {
                const data = await resp.json();
                alert(data.message || '操作失敗');
            }
        };

        async function deleteUser(id) {
            if (confirm('確定要刪除此使用者嗎？此操作不可撤銷。')) {
                await fetch(`/ChineseChess/api/admin/users/delete?id=${id}`, { method: 'POST' });
                fetchUsers();
            }
        }

        async function closeRoom(roomId) {
            if (confirm(`確定要強制關閉房間 ${roomId} 並將所有玩家踢出嗎？`)) {
                await fetch(`/ChineseChess/api/admin/rooms/close?roomId=${roomId}`, { method: 'POST' });
                fetchRooms();
            }
        }

        async function deleteRoom(roomId) {
            if (confirm(`確定要永久刪除房間 ${roomId} 嗎？`)) {
                await fetch(`/ChineseChess/api/admin/rooms/delete?roomId=${roomId}`, { method: 'POST' });
                    fetchRooms();
            }
        }

        $(document).ready(function() {
            fetchOnlineUsers();
            fetchUsers();
            fetchRooms();
            setInterval(() => { 
                fetchOnlineUsers(); 
                fetchUsers(); 
                fetchRooms(); 
            }, 5000);
        });
    </script>
</body>
</html>
