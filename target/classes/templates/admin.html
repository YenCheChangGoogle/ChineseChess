<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel - ChineseChess</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Microsoft JhengHei', sans-serif; }
        .admin-header { background: #343a40; color: white; padding: 20px 0; margin-bottom: 30px; }
    </style>
</head>
<body>
    <div class="admin-header text-center">
        <h1>🛠️ 管理員控制面板</h1>
        <p>系統監控與使用者管理</p>
    </div>

    <div class="container">
        <div class="row mt-5">
            <!-- User Management -->
            <div class="col-md-6">
                <div class="card shadow-sm p-4 mb-4">
                    <h4>👤 使用者管理</h4>
                    <div id="userList" class="mt-3">
                        <!-- 使用者清單將在此動態生成 -->
                        <p class="text-muted">載入中...</p>
                    </div>
                </div>
            </div>

            <!-- Room Management -->
            <div class="col-md-6">
                <div class="card shadow-sm p-4 mb-4">
                    <h4>🏠 房間管理</h4>
                    <div id="roomList" class="mt-3">
                        <!-- 房間清單將在此動態生成 -->
                        <p class="text-muted">載入中...</p>
                    </div>
                </div>
            </div>
        </div>
        <div class="text-center mb-5">
            <a href="/lobby" class="btn btn-secondary">回到遊戲大廳</a>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        async function fetchUsers() {
            try {
                const resp = await fetch('/api/admin/users');
                const users = await resp.json();
                const div = document.getElementById('userList');
                if (users.length === 0) {
                    div.innerHTML = '<p class="text-muted">目前沒有使用者</p>';
                    return;
                }
                let html = '<table class="table table-hover"><thead><tr><th>用戶名</th><th>操作</th></tr></thead><tbody>';
                users.forEach(u => {
                    html += `<tr><td>${u.username}</td><td><button class="btn btn-sm btn-danger" onclick="banUser('${u.username}')">停權</button></td></tr>`;
                });
                html += '</tbody></table>';
                div.innerHTML = html;
            } catch (e) {
                document.getElementById('userList').innerHTML = '<p class="text-danger">載入失敗</p>';
            }
        }

        async function fetchRooms() {
            try {
                const resp = await fetch('/api/rooms/list');
                const rooms = await resp.json();
                const div = document.getElementById('roomList');
                if (rooms.length === 0) {
                    div.innerHTML = '<p class="text-muted">目前沒有活躍房間</p>';
                    return;
                }
                let html = '<table class="table table-hover"><thead><tr><th>房間 ID</th><th>狀態</th><th>操作</th></tr></thead><tbody>';
                rooms.forEach(r => {
                    html += `<tr><td>${r.roomId}</td><td>${r.status}</td><td><button class="btn btn-sm btn-warning" onclick="closeRoom('${r.roomId}')">關閉</button></td></tr>`;
                });
                html += '</tbody></table>';
                div.innerHTML = html;
            } catch (e) {
                document.getElementById('roomList').innerHTML = '<p class="text-danger">載入失敗</p>';
            }
        }

        async function banUser(username) {
            if (confirm(`確定要停權 ${username} 嗎？`)) {
                await fetch(`/api/admin/users/ban?username=${username}`, { method: 'POST' });
                fetchUsers();
            }
        }

        async function closeRoom(roomId) {
            if (confirm(`確定要強制關閉房間 ${roomId} 嗎？`)) {
                await fetch(`/api/admin/rooms/close?roomId=${roomId}`, { method: 'POST' });
                fetchRooms();
            }
        }

        $(document).ready(function() {
            fetchUsers();
            fetchRooms();
            setInterval(() => { fetchUsers(); fetchRooms(); }, 10000);
        });
    </script>
</body>
</html>
    </div>
</body>
</html>
